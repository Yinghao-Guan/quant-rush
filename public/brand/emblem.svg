<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" color="#2B1D10" role="img" aria-labelledby="t">
  <title id="t">Quant Rush emblem</title>
  <!-- The artwork lives in a <symbol> so other documents can reference it:
       <svg><use href="emblem.svg#emblem"/></svg>. The <use> at the bottom renders it standalone. -->
  <symbol id="emblem" viewBox="0 0 120 120">
    <!-- Seal rings -->
    <circle cx="60" cy="60" r="57" fill="none" stroke="currentColor" stroke-width="3"/>
    <circle cx="60" cy="60" r="52" fill="none" stroke="currentColor" stroke-width="1"/>
    <circle cx="60" cy="60" r="36" fill="none" stroke="currentColor" stroke-width="1"/>
    <!-- Ring text -->
    <path id="arc-top" d="M16 60 A44 44 0 0 1 104 60" fill="none"/>
    <path id="arc-bottom" d="M16 60 A44 44 0 0 0 104 60" fill="none"/>
    <text font-family="Oswald, 'Arial Narrow', Arial, sans-serif" font-weight="600" font-size="11" letter-spacing="2.2" fill="currentColor">
      <textPath href="#arc-top" startOffset="50%" text-anchor="middle">QUANT RUSH</textPath>
    </text>
    <text font-family="Oswald, 'Arial Narrow', Arial, sans-serif" font-weight="600" font-size="9" letter-spacing="2" fill="currentColor">
      <textPath href="#arc-bottom" startOffset="50%" text-anchor="middle">SMC · 2026</textPath>
    </text>
    <!-- Side ornaments -->
    <path d="M14 56l4 4-4 4-4-4z" fill="currentColor"/>
    <path d="M106 56l4 4-4 4-4-4z" fill="currentColor"/>
    <!-- Candlestick (vertical) -->
    <path d="M60 30v60" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
    <rect x="53.5" y="46" width="13" height="28" rx="1.5" fill="none" stroke="currentColor" stroke-width="3"/>
    <!-- Pickaxe (diagonal) -->
    <path d="M38 84L78 44" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M68 34c6-2 13 1 18 14" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M68 34L78 44l8 4" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Nugget at the crossing -->
    <path d="M58 53l7 2 3 7-5 7-8-2-3-7z" fill="currentColor"/>
  </symbol>
  <use href="#emblem" width="120" height="120"/>
</svg>
