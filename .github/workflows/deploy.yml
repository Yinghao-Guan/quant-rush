name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build with Astro
        uses: withastro/action@v3
        with:
          node-version: 22
        env:
          # The site is served from the custom domain set in Settings → Pages, so it lives at the root.
          # Without a custom domain, a project site needs:
          #   SITE_URL: https://${{ github.repository_owner }}.github.io
          #   BASE_PATH: /${{ github.event.repository.name }}
          SITE_URL: https://smcqfec.com
          BASE_PATH: /

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
